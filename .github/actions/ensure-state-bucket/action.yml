name: Ensure Terraform state bucket
description: >-
  Create the S3 bucket for Terraform state if it does not exist, then enforce
  its security settings on every run: public access blocked, ACLs disabled,
  versioning, AES256 encryption, HTTPS/TLS 1.2+ only, and expiry of old state
  versions. Requires AWS credentials.

inputs:
  bucket:
    description: State bucket name.
    required: true
  region:
    description: Region of the state bucket.
    required: true

runs:
  using: composite
  steps:
    - name: Ensure state bucket exists
      shell: bash
      env:
        TF_STATE_BUCKET: ${{ inputs.bucket }}
        TF_STATE_REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET to the desired state bucket name}"
        : "${TF_STATE_REGION:?Set AWS_REGION to the Terraform region}"
        account_id=$(aws sts get-caller-identity --query Account --output text)
        if error=$(aws s3api head-bucket --bucket "$TF_STATE_BUCKET" \
          --expected-bucket-owner "$account_id" --region "$TF_STATE_REGION" 2>&1); then
          echo "State bucket already exists."
        elif [[ "$error" == *"(404)"* ]]; then
          create_args=(--bucket "$TF_STATE_BUCKET" --region "$TF_STATE_REGION")
          if [[ "$TF_STATE_REGION" != us-east-1 ]]; then
            create_args+=(--create-bucket-configuration "LocationConstraint=$TF_STATE_REGION")
          fi
          aws s3api create-bucket "${create_args[@]}"
          aws s3api wait bucket-exists --bucket "$TF_STATE_BUCKET" \
            --expected-bucket-owner "$account_id" --region "$TF_STATE_REGION"
        else
          echo "$error" >&2
          exit 1
        fi

    # Idempotent: re-applied every run so drift on the bucket is corrected.
    - name: Enforce state bucket security
      shell: bash
      env:
        TF_STATE_BUCKET: ${{ inputs.bucket }}
        TF_STATE_REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        s3() { aws s3api "$@" --bucket "$TF_STATE_BUCKET" --region "$TF_STATE_REGION"; }

        s3 put-public-access-block --public-access-block-configuration \
          'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
        s3 put-bucket-ownership-controls --ownership-controls \
          '{"Rules":[{"ObjectOwnership":"BucketOwnerEnforced"}]}'
        s3 put-bucket-versioning --versioning-configuration Status=Enabled
        s3 put-bucket-encryption --server-side-encryption-configuration \
          '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

        arn="arn:aws:s3:::$TF_STATE_BUCKET"
        s3 put-bucket-policy --policy "$(jq -cn --arg b "$arn" '{
          Version: "2012-10-17",
          Statement: [
            {Sid: "DenyInsecureTransport", Effect: "Deny", Principal: "*",
             Action: "s3:*", Resource: [$b, "\($b)/*"],
             Condition: {Bool: {"aws:SecureTransport": "false"}}},
            {Sid: "DenyOutdatedTls", Effect: "Deny", Principal: "*",
             Action: "s3:*", Resource: [$b, "\($b)/*"],
             Condition: {NumericLessThan: {"s3:TlsVersion": "1.2"}}}
          ]}')"

        s3 put-bucket-lifecycle-configuration --lifecycle-configuration '{
          "Rules": [{
            "ID": "expire-old-state-versions",
            "Status": "Enabled",
            "Filter": {},
            "NoncurrentVersionExpiration": {"NoncurrentDays": 90, "NewerNoncurrentVersions": 10},
            "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}
          }]}'
        echo "State bucket security settings enforced."
