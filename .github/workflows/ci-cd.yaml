name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production releases.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'menteeTest' || '' }}
    env:
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || vars.APP_VERSION }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate application version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || (( ${#IMAGE_TAG} > 128 )); then
            echo '::error::Set APP_VERSION in the menteeTest environment to a Docker-compatible version such as 1.2.3 or 1.2.3-rc.1.'
            exit 1
          fi
      - name: Check OIDC identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          AWS_ROLE_ARN: arn:aws:iam::030454160336:role/exam-adi-shmul
        with:
          script: |
            const role = process.env.AWS_ROLE_ARN || '';
            if (!/^arn:aws:iam::\d{12}:role\/[\w+=,.@\/-]+$/.test(role)) {
              throw new Error('AWS_ROLE_ARN must contain an IAM role ARN without surrounding whitespace.');
            }
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const {iss, aud, sub} = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`OIDC identity: ${JSON.stringify({iss, aud, sub})}`);
      - name: Connect to AWS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-adi-shmul
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3
      - uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: login
      - name: Reuse release on retry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: existing
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          digest=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --query "imageIds[?imageTag=='$IMAGE_TAG'].imageDigest | [0]" --output text)
          if [ "$digest" != None ]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build image (push on main)
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.login.outputs.registry || 'local' }}/${{ vars.ECR_REPOSITORY || 'exam-adi-shmul' }}:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ github.event_name == 'pull_request' && '0.0.0' || env.IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform.yaml
    with:
      image_uri: ${{ needs.build.outputs.image }}

  deploy:
    needs: [build, terraform]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: menteeTest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ECS_CLUSTER: ${{ needs.terraform.outputs.ecs_cluster }}
      ECS_SERVICE: ${{ needs.terraform.outputs.ecs_service }}
      ECS_TASK_DEFINITION: ${{ needs.terraform.outputs.task_definition }}
      ECS_CONTAINER_NAME: ${{ needs.terraform.outputs.container_name }}
      APP_URL: ${{ needs.terraform.outputs.app_url }}
    steps:
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-adi-shmul
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3
      - name: Download task definition and enable rollback
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --deployment-configuration 'minimumHealthyPercent=100,maximumPercent=200,deploymentCircuitBreaker={enable=true,rollback=true}' \
            > /dev/null
      - name: Set container image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}
      - name: Deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
      - name: Verify health
        run: |
          curl --fail --silent --show-error --max-time 30 "${APP_URL%/}/health" \
            | jq -e '.status == "ok"'
