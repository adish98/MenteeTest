name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/app/**'
      - '.github/workflows/terraform.yaml'
  workflow_call:
    inputs:
      image_uri:
        description: Image built by the application workflow
        required: true
        type: string
    outputs:
      ecs_cluster:
        value: ${{ jobs.apply.outputs.ecs_cluster }}
      ecs_service:
        value: ${{ jobs.apply.outputs.ecs_service }}
      task_definition:
        value: ${{ jobs.apply.outputs.task_definition }}
      container_name:
        value: ${{ jobs.apply.outputs.container_name }}
      app_url:
        value: ${{ jobs.apply.outputs.app_url }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/app
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize for validation
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: Initialize TFLint
        run: tflint --init
      - name: Lint
        run: tflint --format compact

  plan:
    needs: lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: menteeTest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/app
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_image_uri: ${{ inputs.image_uri }}
      TF_VAR_name: ${{ vars.TF_APP_NAME || 'exam-adi-shmul' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-adi-shmul
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3
      - name: Ensure state bucket exists
        uses: ./.github/actions/ensure-state-bucket
        with:
          bucket: ${{ vars.TF_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
      - name: Initialize remote state
        run: |
          terraform init -lockfile=readonly             -backend-config="bucket=$TF_STATE_BUCKET"             -backend-config="region=$TF_STATE_REGION"
      - name: Plan
        run: terraform plan -lock-timeout=5m -out=app.tfplan
      # Reviewers read the plan here before approving the apply job.
      - name: Publish plan for review
        run: |
          {
            echo '## Terraform plan'
            echo
            echo "Image: \`$TF_VAR_image_uri\`"
            echo
            echo '```text'
            terraform show -no-color app.tfplan | tail -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-app-plan
          path: terraform/app/app.tfplan
          retention-days: 1
          if-no-files-found: error

  # Manual gate: the run pauses here until a required reviewer of the
  # menteeTest-approval environment clicks "Review deployments" > Approve.
  # Required reviewers can only be set in Settings > Environments, not in YAML.
  # Waiting does not count toward timeout-minutes (GitHub waits up to 30 days).
  approve:
    needs: plan
    runs-on: ubuntu-latest
    environment: menteeTest-approval
    timeout-minutes: 5
    steps:
      - name: Plan approved
        run: echo "Plan approved by a reviewer; continuing to apply."

  apply:
    needs: approve
    runs-on: ubuntu-latest
    environment: menteeTest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-app
      cancel-in-progress: false
    outputs:
      ecs_cluster: ${{ steps.outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.outputs.outputs.ecs_service }}
      task_definition: ${{ steps.outputs.outputs.task_definition }}
      container_name: ${{ steps.outputs.outputs.container_name }}
      app_url: ${{ steps.outputs.outputs.app_url }}
    defaults:
      run:
        working-directory: terraform/app
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-adi-shmul
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3
      - name: Initialize remote state
        run: |
          terraform init -lockfile=readonly             -backend-config="bucket=$TF_STATE_BUCKET"             -backend-config="region=$TF_STATE_REGION"
      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-app-plan
          path: terraform/app
      # Applies exactly the reviewed plan. Terraform rejects it as stale if the
      # state changed since planning.
      - name: Apply approved plan
        run: terraform apply -lock-timeout=5m app.tfplan
      - name: Export deployment outputs
        id: outputs
        run: |
          for mapping in             ecs_cluster:ecs_cluster_name             ecs_service:ecs_service_name             task_definition:ecs_task_definition_family             container_name:ecs_container_name             app_url:application_url; do
            value=$(terraform output -raw "${mapping#*:}")
            echo "${mapping%%:*}=$value" >> "$GITHUB_OUTPUT"
          done
          echo "::notice title=Application URL::$(terraform output -raw application_url)"
