name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/app/**'
      - '.github/workflows/terraform.yaml'
  workflow_call:
    inputs:
      image_uri:
        description: Image built by the application workflow
        required: true
        type: string
    outputs:
      ecs_cluster:
        value: ${{ jobs.plan-and-apply.outputs.ecs_cluster }}
      ecs_service:
        value: ${{ jobs.plan-and-apply.outputs.ecs_service }}
      task_definition:
        value: ${{ jobs.plan-and-apply.outputs.task_definition }}
      container_name:
        value: ${{ jobs.plan-and-apply.outputs.container_name }}
      app_url:
        value: ${{ jobs.plan-and-apply.outputs.app_url }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/app
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize for validation
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: Initialize TFLint
        run: tflint --init
      - name: Lint
        run: tflint --format compact

  plan-and-apply:
    needs: lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: menteeTest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-app
      cancel-in-progress: false
    outputs:
      ecs_cluster: ${{ steps.outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.outputs.outputs.ecs_service }}
      task_definition: ${{ steps.outputs.outputs.task_definition }}
      container_name: ${{ steps.outputs.outputs.container_name }}
      app_url: ${{ steps.outputs.outputs.app_url }}
    defaults:
      run:
        working-directory: terraform/app
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_image_uri: ${{ inputs.image_uri }}
      TF_VAR_execution_role_arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      TF_VAR_name: ${{ vars.TF_APP_NAME || 'exam-adi-shmul' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-adi-shmul
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3
      - name: Ensure state bucket exists
        shell: bash
        run: |
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET to the desired state bucket name}"
          : "${TF_STATE_REGION:?Set AWS_REGION to the Terraform region}"
          account_id=$(aws sts get-caller-identity --query Account --output text)
          if error=$(aws s3api head-bucket --bucket "$TF_STATE_BUCKET" \
            --expected-bucket-owner "$account_id" --region "$TF_STATE_REGION" 2>&1); then
            echo "State bucket already exists; skipping creation."

          elif [[ "$error" == *"(404)"* ]]; then
            create_args=(--bucket "$TF_STATE_BUCKET" --region "$TF_STATE_REGION")

            if [[ "$TF_STATE_REGION" != us-east-1 ]]; then
              create_args+=(--create-bucket-configuration "LocationConstraint=$TF_STATE_REGION")
            fi
            
            aws s3api create-bucket "${create_args[@]}"
            aws s3api wait bucket-exists --bucket "$TF_STATE_BUCKET" \
              --expected-bucket-owner "$account_id" --region "$TF_STATE_REGION"
            aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "$error" >&2
            exit 1
          fi
      - name: Initialize remote state
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$TF_STATE_REGION"
      - name: Plan
        run: terraform plan -lock-timeout=5m -out=app.tfplan
      - name: Apply on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -lock-timeout=5m app.tfplan
      - name: Export deployment outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: outputs
        run: |
          for mapping in \
            ecs_cluster:ecs_cluster_name \
            ecs_service:ecs_service_name \
            task_definition:ecs_task_definition_family \
            container_name:ecs_container_name \
            app_url:application_url; do
            value=$(terraform output -raw "${mapping#*:}")
            echo "${mapping%%:*}=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Publish app variables
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.TF_VARIABLES_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh variable set ECS_CLUSTER --body "$(terraform output -raw ecs_cluster_name)"
          gh variable set ECS_SERVICE --body "$(terraform output -raw ecs_service_name)"
          gh variable set ECS_TASK_DEFINITION --body "$(terraform output -raw ecs_task_definition_family)"
          gh variable set ECS_CONTAINER_NAME --body "$(terraform output -raw ecs_container_name)"
          gh variable set APP_URL --body "$(terraform output -raw application_url)"
