name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/app/**'
      - '.github/workflows/terraform.yaml'
  push:
    branches: [main]
    paths:
      - 'terraform/app/**'
      - '.github/workflows/terraform.yaml'

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/app
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize for validation
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: Initialize TFLint
        run: tflint --init
      - name: Lint
        run: tflint --format compact

  plan-and-apply:
    needs: lint
    # Fork pull requests receive no AWS access.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-app
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/app
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_image_uri: ${{ vars.TF_IMAGE_URI }}
      TF_VAR_name: ${{ vars.TF_APP_NAME || 'hello-world' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
          terraform_wrapper: false
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'push' && vars.TF_APPLY_ROLE_ARN || vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize remote state
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$TF_STATE_REGION"
      - name: Plan
        run: terraform plan -lock-timeout=5m -out=app.tfplan
      - name: Apply on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -lock-timeout=5m app.tfplan
